# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.dukonpro.tj admin.dukonpro.tj;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# API
server {
    listen 443 ssl;
    server_name api.dukonpro.tj;

    ssl_certificate /etc/letsencrypt/live/api.dukonpro.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dukonpro.tj/privkey.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass http://api:4455;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin Panel
server {
    listen 443 ssl;
    server_name admin.dukonpro.tj;

    ssl_certificate /etc/letsencrypt/live/admin.dukonpro.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.dukonpro.tj/privkey.pem;

    location / {
        proxy_pass http://admin:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
