services:
  postgres:
    image: postgres:16-alpine
    container_name: dukonpro-db
    restart: unless-stopped
    ports:
      - '5435:5432'
    environment:
      POSTGRES_DB: dukonpro
      POSTGRES_USER: dukonpro
      POSTGRES_PASSWORD: dukonpro_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dukonpro']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dukonpro-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
