name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Nest / Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install deps
        run: npm ci

      - name: npm audit (high+ only — advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (Jest)
        run: npm test -- --ci --colors

      # Build is a stronger signal than typecheck alone — it also exercises
      # the nest build step which is what prod actually runs.
      - name: Build
        run: npm run build

  backend-e2e:
    name: Backend e2e (Jest + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dukonpro
          POSTGRES_PASSWORD: dukonpro
          POSTGRES_DB: dukonpro
        ports: ['5435:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://dukonpro:dukonpro@localhost:5435/dukonpro?schema=public
      # The app refuses to boot without these (see
      # api/src/common/bootstrap/validate-config.ts) — e2e tests create the
      # real Nest app (JwtAccessStrategy etc. call configService.getOrThrow),
      # unlike the unit-test job above which never boots the full app. These
      # are throwaway values for a disposable CI Postgres container, not real
      # secrets — never reuse them outside CI.
      JWT_ACCESS_SECRET: 706c8873d54d8052dfa5e9f18015d159fab477a203f428ec3b11ca66bd4729304ae03375107f06f93b1383f004a14f4884d359271c174be1698fd0a312992b8e
      JWT_REFRESH_SECRET: 6cf05e14dc0c6a9c78c9095019a8fd807d54deb0344b33c9bfcf23c5c796fa67091b4244e8191851b41d8b90c8396b63bee0007e3e60c64c3ea5a127abe64182
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Prisma migrate deploy
        run: npx prisma migrate deploy
      - name: e2e tests (Jest)
        run: npm run test:e2e -- --ci --colors

  flutter:
    name: Flutter app (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin to the exact version used locally so the dep solver in CI
          # matches dev machines and we don't chase pubspec.lock drift.
          # Bump this alongside a `flutter upgrade` on the local repo.
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Fetch packages
        run: flutter pub get

      - name: flutter pub outdated (advisory)
        run: flutter pub outdated --no-dependency-overrides --no-dev-dependencies
        continue-on-error: true

      - name: Dart analyze (strict)
        run: flutter analyze

      - name: i18n lint (check_i18n.dart)
        run: dart run tool/check_i18n.dart

      - name: Flutter unit tests
        run: flutter test --reporter expanded

  audit-artifacts:
    name: Audit docs sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ADR + full audit docs exist
        run: |
          set -e
          test -d docs/adr
          test -d docs/audit
          # Individual audit artifacts that must never be silently deleted
          # from main. PR #1 merged the 2026-04-10 audit history — if any
          # of these files go missing CI fails so someone has to explain
          # in a commit message why.
          test -f docs/audit/2026-04-10-full-audit-plan.md
          test -f docs/audit/2026-04-10-full-audit-report.md
          test -f docs/audit/backend-routes-matrix.md
          test -f docs/audit/backend-static-findings.md
          test -f docs/audit/flutter-screens-matrix.md
          test -f docs/audit/flutter-static-findings.md
          test -f docs/audit/2026-04-11-cold-start-perf-baseline.md
          # ADRs: each must be a real file, and the directory must have
          # at least the three we've written so far.
          test -f docs/adr/0001-phone-otp-verification.md
          test -f docs/adr/0002-i18n-rollout-plan.md
          test -f docs/adr/0003-staff-invite-flow.md
          echo "Audit docs + ADRs present."
