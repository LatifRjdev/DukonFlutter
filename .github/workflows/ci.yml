name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Nest / Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (Jest)
        run: npm test -- --ci --colors

      # Build is a stronger signal than typecheck alone — it also exercises
      # the nest build step which is what prod actually runs.
      - name: Build
        run: npm run build

  flutter:
    name: Flutter app (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Fetch packages
        run: flutter pub get

      - name: Dart analyze
        run: flutter analyze --no-fatal-infos

      - name: i18n lint (check_i18n.dart)
        run: dart run tool/check_i18n.dart

      - name: Flutter unit tests
        run: flutter test --reporter expanded

  audit-artifacts:
    name: Audit docs sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ADR + audit docs exist
        run: |
          test -d docs/adr
          test -d docs/audit
          test -f docs/audit/2026-04-10-full-audit-report.md
          echo "Audit docs present."
