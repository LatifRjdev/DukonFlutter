<!DOCTYPE html>

<html class="light" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DukonPro Refund Processing</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f34135",
                        "background-light": "#ffffff",
                        "background-dark": "#221110",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input[type="checkbox"] {
            --checkbox-tick-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27white%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3cpath d=%27M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z%27/%3e%3c/svg%3e');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#1c0e0d] dark:text-white min-h-screen flex justify-center">
<!-- iPhone 14 Pro Container -->
<div class="relative w-full max-w-[393px] min-h-screen bg-white dark:bg-[#1c0e0d] shadow-2xl overflow-y-auto pb-10">
<!-- TopAppBar -->
<div class="sticky top-0 z-50 flex items-center bg-white/80 dark:bg-[#1c0e0d]/80 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100 dark:border-gray-800">
<div class="text-[#1c0e0d] dark:text-white flex size-10 shrink-0 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-[#1c0e0d] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Возврат товара</h2>
</div>
<!-- Search TextField -->
<div class="px-4 py-4">
<label class="flex flex-col w-full">
<p class="text-[#1c0e0d] dark:text-gray-300 text-sm font-medium leading-normal pb-2">Введите номер чека</p>
<div class="flex w-full items-stretch rounded-xl overflow-hidden border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
<input class="form-input flex w-full min-w-0 flex-1 resize-none border-none bg-transparent h-12 placeholder:text-gray-400 px-4 text-base font-normal focus:ring-0" placeholder="Номер чека или сканируйте" value="1234"/>
<div class="text-primary flex items-center justify-center px-4 cursor-pointer">
<span class="material-symbols-outlined">barcode_scanner</span>
</div>
</div>
</label>
</div>
<!-- Found Receipt Card -->
<div class="px-4 pb-4">
<div class="flex items-center justify-between gap-4 rounded-xl bg-white dark:bg-gray-800 p-4 shadow-sm border border-gray-100 dark:border-gray-700">
<div class="flex flex-col gap-1">
<p class="text-primary text-sm font-semibold leading-normal">Чек #1234</p>
<p class="text-[#1c0e0d] dark:text-white text-base font-bold leading-tight">490 TJS</p>
<p class="text-gray-500 dark:text-gray-400 text-xs font-normal">30.01.2026</p>
</div>
<div class="bg-gray-50 dark:bg-gray-700 rounded-lg px-3 py-1">
<span class="text-xs font-medium text-gray-600 dark:text-gray-300 uppercase tracking-wider">Оплачено</span>
</div>
</div>
</div>
<!-- Section Header -->
<h3 class="text-[#1c0e0d] dark:text-white text-base font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-2">Выберите товары для возврата</h3>
<!-- Itemized Checklist -->
<div class="flex flex-col divide-y divide-gray-50 dark:divide-gray-800">
<!-- Item 1: Checked -->
<div class="flex items-center gap-4 bg-white dark:bg-gray-800/50 px-4 min-h-[72px] py-3 justify-between">
<div class="flex items-center gap-4">
<div class="flex size-6 items-center justify-center">
<input checked="" class="h-5 w-5 rounded border-gray-300 dark:border-gray-600 text-primary focus:ring-primary focus:ring-offset-0 bg-transparent checked:bg-primary" type="checkbox"/>
</div>
<div class="flex flex-col justify-center">
<p class="text-[#1c0e0d] dark:text-white text-sm font-semibold leading-normal">Кофе растворимый</p>
<p class="text-gray-500 dark:text-gray-400 text-xs font-normal">2 шт × 180 = 360 TJS</p>
</div>
</div>
<div class="shrink-0">
<div class="flex items-center gap-3 text-[#1c0e0d] dark:text-white">
<button class="flex h-8 w-8 items-center justify-center rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200">-</button>
<span class="text-sm font-bold w-4 text-center">1</span>
<button class="flex h-8 w-8 items-center justify-center rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200">+</button>
</div>
</div>
</div>
<!-- Item 2: Unchecked -->
<div class="flex items-center gap-4 bg-white dark:bg-gray-800/50 px-4 min-h-[72px] py-3 justify-between">
<div class="flex items-center gap-4">
<div class="flex size-6 items-center justify-center">
<input class="h-5 w-5 rounded border-gray-300 dark:border-gray-600 text-primary focus:ring-primary focus:ring-offset-0 bg-transparent" type="checkbox"/>
</div>
<div class="flex flex-col justify-center">
<p class="text-[#1c0e0d] dark:text-white text-sm font-semibold leading-normal opacity-60">Сахар 1кг</p>
<p class="text-gray-500 dark:text-gray-400 text-xs font-normal opacity-60">1 шт × 55 = 55 TJS</p>
</div>
</div>
<div class="shrink-0 opacity-40">
<div class="flex items-center gap-3 text-[#1c0e0d] dark:text-white">
<button class="flex h-8 w-8 items-center justify-center rounded-full bg-gray-100 dark:bg-gray-700" disabled="">-</button>
<span class="text-sm font-bold w-4 text-center">0</span>
<button class="flex h-8 w-8 items-center justify-center rounded-full bg-gray-100 dark:bg-gray-700" disabled="">+</button>
</div>
</div>
</div>
<!-- Item 3: Unchecked -->
<div class="flex items-center gap-4 bg-white dark:bg-gray-800/50 px-4 min-h-[72px] py-3 justify-between">
<div class="flex items-center gap-4">
<div class="flex size-6 items-center justify-center">
<input class="h-5 w-5 rounded border-gray-300 dark:border-gray-600 text-primary focus:ring-primary focus:ring-offset-0 bg-transparent" type="checkbox"/>
</div>
<div class="flex flex-col justify-center">
<p class="text-[#1c0e0d] dark:text-white text-sm font-semibold leading-normal opacity-60">Молоко 1л</p>
<p class="text-gray-500 dark:text-gray-400 text-xs font-normal opacity-60">3 шт × 25 = 75 TJS</p>
</div>
</div>
<div class="shrink-0 opacity-40">
<div class="flex items-center gap-3 text-[#1c0e0d] dark:text-white">
<button class="flex h-8 w-8 items-center justify-center rounded-full bg-gray-100 dark:bg-gray-700" disabled="">-</button>
<span class="text-sm font-bold w-4 text-center">0</span>
<button class="flex h-8 w-8 items-center justify-center rounded-full bg-gray-100 dark:bg-gray-700" disabled="">+</button>
</div>
</div>
</div>
</div>
<!-- Form Controls -->
<div class="px-4 py-6 space-y-6">
<!-- Dropdown -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-gray-700 dark:text-gray-300">Причина возврата</label>
<div class="relative">
<select class="w-full h-12 rounded-xl border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm focus:ring-primary focus:border-primary appearance-none px-4">
<option>Брак</option>
<option>Не подошёл</option>
<option>Ошибка в чеке</option>
<option>Истек срок годности</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 pointer-events-none text-gray-400">expand_more</span>
</div>
</div>
<!-- Radio Group -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-gray-700 dark:text-gray-300">Способ возврата</label>
<div class="flex flex-col gap-3">
<label class="flex items-center gap-3 cursor-pointer">
<input checked="" class="h-5 w-5 text-primary border-gray-300 focus:ring-primary focus:ring-offset-0 bg-transparent" name="payment_method" type="radio"/>
<span class="text-sm font-medium">Наличными</span>
</label>
<label class="flex items-center gap-3 cursor-pointer">
<input class="h-5 w-5 text-primary border-gray-300 focus:ring-primary focus:ring-offset-0 bg-transparent" name="payment_method" type="radio"/>
<span class="text-sm font-medium">На карту (Терминал)</span>
</label>
</div>
</div>
</div>
<!-- Summary Info Card -->
<div class="px-4 pb-6">
<div class="bg-primary/5 dark:bg-primary/10 border border-primary/20 rounded-xl p-4 flex justify-between items-center">
<span class="text-gray-700 dark:text-gray-300 font-medium">Сумма возврата:</span>
<span class="text-primary text-xl font-bold">180 TJS</span>
</div>
</div>
<!-- Bottom Action -->
<div class="px-4 pb-8">
<button class="w-full bg-primary hover:bg-red-600 text-white font-bold py-4 rounded-xl shadow-lg transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined">assignment_return</span>
                Оформить возврат
            </button>
</div>
</div>
</body></html>
