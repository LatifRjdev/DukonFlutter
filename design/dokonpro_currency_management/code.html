                        "background-light": "#f5f5f5",
                        "background-dark": "#0f2023",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]

                        "DEFAULT": "0.5rem",

<style>

        }
        .iphone-container {
            width: 393px;
            height: 852px;
            overflow-y: auto;
            position: relative;
            scrollbar-width: none;
        }
        .iphone-container::-webkit-scrollbar {

        }

<style>

<!-- Bottom Action Button -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-[393px] bg-white dark:bg-gray-950 p-6 pb-10 border-t border-gray-100 dark:border-gray-900">
<button class="w-full bg-primary text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all">
                Пересчитать себестоимость

</div>
<!-- iOS Safe Area Indicator Mockup -->
<div class="absolute bottom-1.5 left-1/2 -translate-x-1/2 w-32 h-1 bg-gray-400 rounded-full opacity-30"></div>
