<!DOCTYPE html>

<html class="light" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DokonPro Store Settings Edit</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#10b1c6",
                        "background-light": "#f5f5f5",
                        "background-dark": "#102022",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
    }
.custom-toggle:checked + .toggle-dot {
    transform: translatex(100%);
    background-color: white
    }
.custom-toggle:checked + .toggle-bg {
    background-color: #10b1c6
    }
select {
    appearance: none;
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuD48yArkxPwE_2fAh4UuDV1AAmv6DJRjfSPmVO2aC5S9B6pDTGcvngPJVV_LKBSjE3pbpAnLQPW7JM3y_05aa_M9zsiNz7aiv7otriSsRjlOeZFdvlSAfw34ZXbyUCiOF6WirgxiYilTPKSJBfykufktmngbKJKVKLs4EN9YrqsWu_qn4k48GAkDSSR41a6ME2Q2qft_CQDsobDK2XZWgDPUCb5fSm1lKwhtsdR8z7AwjgH8DqDErjvygVGs564ezLbh-f3K28mAxri);
    background-position: right 0.5rem center;
    background-repeat: no-repeat;
    background-size: 1.5em 1.5em
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#0d1a1b] dark:text-white antialiased">
<div class="mx-auto min-h-screen max-w-[393px] bg-background-light dark:bg-background-dark shadow-xl overflow-x-hidden">
<!-- Header -->
<header class="sticky top-0 z-50 flex items-center bg-white dark:bg-background-dark/90 backdrop-blur-md p-4 justify-between border-b border-gray-100 dark:border-gray-800">
<div class="flex size-10 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined text-[#0d1a1b] dark:text-white">arrow_back</span>
</div>
<h1 class="text-[#0d1a1b] dark:text-white text-lg font-semibold leading-tight tracking-tight flex-1 text-center">Основной магазин</h1>
<div class="flex size-10 items-center justify-end cursor-pointer">
<span class="material-symbols-outlined text-[#0d1a1b] dark:text-white">more_horiz</span>
</div>
</header>
<main class="flex flex-col gap-6 pb-12">
<!-- Store Logo Section -->
<section class="flex flex-col items-center pt-8">
<div class="relative group cursor-pointer">
<div class="size-20 rounded-full bg-gray-200 dark:bg-gray-700 bg-cover bg-center border-2 border-white dark:border-gray-800 shadow-sm" data-alt="Modern store logo circular placeholder" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD48CiUJZsdIAIsia8LAHlPb9cj6nwByFwdbfOws8c5lwyuQxW4OxDkCnQNcdER2Bsa7Jcen61RkdDNNKYLnl18lmbE1mZGbhOL4P2pK-JlXwC5VaJs0rBmoCIDXTDqLreBRSz0_8oT0XwIavrDTsf9QMQsH5xIBfthC4PbrhShT7E48I2VJBWf7fyC7mBIGVV8pC6q-wNYy2nkJT-7CCgdyiyZSOi8c4gyLrfxItwhpEHiaHDIiOV23yKf54lf23C8bQ0J55YG0v4I');">
</div>
<div class="absolute bottom-0 right-0 bg-primary text-white p-1 rounded-full border-2 border-white dark:border-gray-800 flex items-center justify-center">
<span class="material-symbols-outlined text-sm">photo_camera</span>
</div>
</div>
<button class="mt-2 text-primary text-sm font-semibold hover:opacity-80 transition-opacity">Изменить</button>
</section>
<!-- Information Section -->
<section class="px-4">
<div class="bg-white dark:bg-gray-900 rounded-xl p-4 shadow-sm flex flex-col gap-4">
<h2 class="text-[#0d1a1b] dark:text-white text-base font-semibold">Информация</h2>
<div class="flex flex-col gap-1.5">
<label class="text-[#4c919a] text-xs font-medium ml-1">Название магазина</label>
<input class="w-full rounded-lg border border-[#cfe5e7] dark:border-gray-700 bg-transparent px-4 py-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="Введите название" type="text" value="DokonPro Store"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-[#4c919a] text-xs font-medium ml-1">Категория</label>
<select class="w-full rounded-lg border border-[#cfe5e7] dark:border-gray-700 bg-transparent px-4 py-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
<option value="retail">Розничная торговля</option>
<option value="grocery">Продукты</option>
<option value="electronics">Электроника</option>
</select>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-[#4c919a] text-xs font-medium ml-1">Адрес</label>
<input class="w-full rounded-lg border border-[#cfe5e7] dark:border-gray-700 bg-transparent px-4 py-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="Укажите адрес" type="text" value="ул. Рудаки 45"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-[#4c919a] text-xs font-medium ml-1">Телефон магазина</label>
<input class="w-full rounded-lg border border-[#cfe5e7] dark:border-gray-700 bg-transparent px-4 py-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="+992" type="tel" value="+992 900 00 00 00"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-[#4c919a] text-xs font-medium ml-1">Валюта</label>
<select class="w-full rounded-lg border border-[#cfe5e7] dark:border-gray-700 bg-transparent px-4 py-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
<option value="TJS">TJS (Сомони)</option>
<option value="USD">USD (Доллар)</option>
<option value="RUB">RUB (Рубль)</option>
</select>
</div>
</div>
</section>
<!-- Receipt Section -->
<section class="px-4">
<div class="bg-white dark:bg-gray-900 rounded-xl p-4 shadow-sm flex flex-col gap-4">
<h2 class="text-[#0d1a1b] dark:text-white text-base font-semibold">Чек</h2>
<div class="flex flex-col gap-1.5">
<label class="text-[#4c919a] text-xs font-medium ml-1">Название на чеке</label>
<input class="w-full rounded-lg border border-[#cfe5e7] dark:border-gray-700 bg-transparent px-4 py-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" type="text" value="DokonPro Ltd."/>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-[#4c919a] text-xs font-medium ml-1">Адрес на чеке</label>
<input class="w-full rounded-lg border border-[#cfe5e7] dark:border-gray-700 bg-transparent px-4 py-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" type="text" value="г. Душанбе, ул. Рудаки 45"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-[#4c919a] text-xs font-medium ml-1">Текст внизу</label>
<textarea class="w-full rounded-lg border border-[#cfe5e7] dark:border-gray-700 bg-transparent px-4 py-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all resize-none" rows="2">Спасибо за покупку!</textarea>
</div>
<div class="flex items-center justify-between py-2 border-t border-gray-50 dark:border-gray-800 mt-2">
<span class="text-sm font-medium text-[#0d1a1b] dark:text-white">Показывать QR-код</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only custom-toggle" type="checkbox"/>
<div class="w-11 h-6 bg-gray-200 dark:bg-gray-700 rounded-full toggle-bg transition-colors duration-200 ease-in-out"></div>
<div class="absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full toggle-dot transition-transform duration-200 ease-in-out border border-gray-300 dark:border-transparent"></div>
</label>
</div>
</div>
</section>
<!-- Danger Zone -->
<section class="px-4">
<div class="bg-white dark:bg-gray-900 rounded-xl p-4 shadow-sm border-l-4 border-red-500 flex flex-col gap-4">
<h2 class="text-red-500 text-base font-semibold">Опасная зона</h2>
<div class="flex flex-col gap-3">
<button class="w-full flex items-center justify-center gap-2 rounded-lg border border-orange-400 bg-transparent px-4 py-3 text-sm font-semibold text-orange-500 hover:bg-orange-50 dark:hover:bg-orange-950/20 transition-all">
<span class="material-symbols-outlined text-lg">pause_circle</span>
                            Деактивировать магазин
                        </button>
<button class="w-full flex items-center justify-center gap-2 rounded-lg border border-red-500 bg-transparent px-4 py-3 text-sm font-semibold text-red-500 hover:bg-red-50 dark:hover:bg-red-950/20 transition-all">
<span class="material-symbols-outlined text-lg">delete</span>
                            Удалить магазин
                        </button>
</div>
</div>
</section>
</main>
<!-- Fixed Save Button Placeholder (Optional for better UX) -->
<div class="fixed bottom-0 left-0 right-0 max-w-[393px] mx-auto p-4 bg-white/80 dark:bg-background-dark/80 backdrop-blur-lg border-t border-gray-100 dark:border-gray-800">
<button class="w-full bg-primary text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all">
                Сохранить изменения
            </button>
</div>
</div>
</body></html>
