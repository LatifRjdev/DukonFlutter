<span class="material-symbols-outlined">photo_camera</span>
</div>
<span class="text-white text-sm font-medium drop-shadow-md">Изменить фото</span>
</div>
</div>
</div>

</div>
</div>

<div class="relative flex">
<input class="w-full rounded-xl border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-[#0d1a1c] dark:text-white h-12 px-3 text-base" type="text" value="150"/>
<span class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 text-sm">TJS</span>

</div>

<label class="text-xs font-medium text-gray-500 uppercase tracking-wider px-1">Оптовая цена</label>

<input class="w-full rounded-xl border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-[#0d1a1c] dark:text-white h-12 px-3 text-base" type="text" value="165"/>
<span class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 text-sm">TJS</span>
</div>
</div>
</div>
<div class="bg-primary/10 border border-primary/20 rounded-xl p-4 flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-xl">analytics</span>
<p class="text-primary text-sm font-semibold">
                        Маржа: <span class="text-[#0d1a1c] dark:text-white">16.7%</span> | Прибыль: <span class="text-[#0d1a1c] dark:text-white">30 TJS</span>
</p>
</div>
</div>

<input class="w-full rounded-xl border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-500 h-14 px-4 pr-12 text-base cursor-not-allowed" disabled="" type="text" value="45 шт"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">lock</span>

<div class="grid grid-cols-2 gap-3">

<div class="relative">
<select class="w-full rounded-xl border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-[#0d1a1c] dark:text-white h-12 px-3 text-sm">
<option>шт</option>
<option>кг</option>
<option>упак</option>
</select>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-xs font-medium text-gray-500 uppercase px-1">Поставщик</label>
<div class="relative">
<select class="w-full rounded-xl border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-[#0d1a1c] dark:text-white h-12 px-3 text-sm">
<option>Global Coffee</option>
<option>ООО Импорт</option>
</select>
</div>
</div>
</div>
</div>
</div>

</div>

<div class="absolute right-0.5 top-0.5 size-5 bg-white rounded-full shadow-sm"></div>

<button class="flex-[1.5] h-14 rounded-xl bg-primary text-white font-bold text-base shadow-lg shadow-primary/30 transition-active active:scale-95">Сохранить</button>
