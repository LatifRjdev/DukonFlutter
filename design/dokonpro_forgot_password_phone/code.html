<!DOCTYPE html>

<html class="light" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#05b9d1",
                        "background-light": "#ffffff",
                        "background-dark": "#0f2023",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>DukonPro Forgot Password</title>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex justify-center">
<!-- iPhone 14 Pro Container (393x852) -->
<div class="relative w-full max-w-[393px] h-screen max-h-[852px] flex flex-col bg-background-light dark:bg-background-dark overflow-hidden">
<!-- TopAppBar -->
<div class="flex items-center p-4 pt-12 pb-2 justify-between">
<div class="text-[#0d1a1c] dark:text-white flex size-10 shrink-0 items-center justify-center cursor-pointer">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</div>
<h2 class="text-[#0d1a1c] dark:text-white text-lg font-semibold leading-tight tracking-tight flex-1 text-center pr-10">Восстановление пароля</h2>
</div>
<div class="flex-1 overflow-y-auto px-6 flex flex-col items-center">
<!-- Hero Icon (ImageGrid derivative) -->
<div class="pt-8 pb-6 flex justify-center">
<div class="flex items-center justify-center w-24 h-24 bg-primary/10 dark:bg-primary/20 rounded-full">
<div class="flex items-center justify-center w-16 h-16 bg-primary rounded-full text-white shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-4xl">lock_reset</span>
</div>
</div>
</div>
<!-- HeadlineText -->
<h3 class="text-[#0d1a1c] dark:text-white text-2xl font-bold leading-tight text-center pb-2">Забыли пароль?</h3>
<!-- BodyText -->
<p class="text-[#757575] dark:text-gray-400 text-sm font-normal leading-relaxed text-center pb-8 px-2">
                Введите номер телефона, на который зарегистрирован аккаунт. Мы отправим SMS с кодом подтверждения.
            </p>
<!-- TextField -->
<div class="w-full space-y-2">
<label class="block">
<span class="text-[#0d1a1c] dark:text-gray-200 text-sm font-medium pb-2 block">Номер телефона</span>
<div class="relative flex items-center">
<div class="absolute left-4 text-[#47949e] flex items-center pointer-events-none">
<span class="material-symbols-outlined text-xl">call</span>
</div>
<input class="w-full bg-background-light dark:bg-background-dark border border-gray-200 dark:border-gray-700 text-[#0d1a1c] dark:text-white rounded-lg h-14 pl-12 pr-4 focus:ring-2 focus:ring-primary focus:border-primary placeholder:text-[#47949e]/50 text-base" placeholder="+992 __ ___ __ __" type="tel"/>
</div>
</label>
</div>
<!-- Primary Action Button -->
<div class="w-full pt-8">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-4 rounded-lg shadow-md transition-all active:scale-[0.98]">
                    Отправить код
                </button>
</div>
</div>
<!-- Footer -->
<div class="p-6 mb-8 text-center">
<p class="text-[#757575] dark:text-gray-400 text-sm">
                Вспомнили пароль? 
                <a class="text-primary font-semibold hover:underline decoration-primary/30" href="#">Войти</a>
</p>
</div>
<!-- Safe Area Indicator (Visual only) -->
<div class="flex justify-center pb-2">
<div class="w-32 h-1 bg-gray-200 dark:bg-gray-800 rounded-full"></div>
</div>
</div>
</body></html>
