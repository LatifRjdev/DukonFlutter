<!DOCTYPE html>

<html class="light" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#05b9d1",
                        "background-light": "#f8fbfc",
                        "background-dark": "#0f2023",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .spinner {
            border: 4px solid rgba(5, 185, 209, 0.1);
            border-left-color: #05b9d1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<!-- Main Container: iPhone 14 Pro Dimensions (393x852) -->
<div class="relative mx-auto h-[852px] w-[393px] flex flex-col bg-white dark:bg-background-dark overflow-hidden shadow-2xl">
<!-- Status Bar Spacer (Dynamic Island area) -->
<div class="h-12 w-full"></div>
<!-- TopAppBar -->
<div class="flex items-center p-4 pb-2 justify-between">
<div class="text-[#0d1a1c] dark:text-white flex size-12 shrink-0 items-center cursor-pointer">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-[#0d1a1c] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Поиск по фото</h2>
</div>
<div class="flex-1 flex flex-col px-6">
<!-- Images Preview Card -->
<div class="mt-4 w-full">
<div class="w-full aspect-[3/2] rounded-xl overflow-hidden shadow-lg border border-gray-100 dark:border-gray-800">
<div class="w-full h-full bg-center bg-no-repeat bg-cover" data-alt="Modern coffee packaging on a white table" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuANI8wtlVSrqLHA5xNFck0PpYN0ovSaT20DCeac3IwHQHHAKFjjPqlmiwgJMyV8KED2OJyMuOW15fERni_XpoGESYe3OSWT-0WZBm6pmhzY7X5cIjnh627GGLHskp-y4VSiU2nvOf18wRwFiJYMKsXm2tjJxkqBcLerS7FI1o-HsjDLyph52jyTQAX2b-rc77RmGXJp8hQcmS4yPiQCKNJf4sl7fT_e2GfUokmU3Z7Qso8fiTeAb7vx4Yf-zQs1MkCcTfboFG4pDcS1");'>
</div>
</div>
</div>
<!-- Central Processing Area -->
<div class="flex flex-col items-center justify-center mt-16 flex-grow-0">
<!-- Spinner Placeholder (CSS Animation simulated by UI) -->
<div class="spinner mb-6"></div>
<!-- SectionHeader Replacement -->
<h4 class="text-primary text-base font-bold leading-normal tracking-[0.015em] text-center mb-2">
                    Анализируем изображение...
                </h4>
<!-- BodyText Replacement -->
<p class="text-[#757575] dark:text-gray-400 text-sm font-normal leading-normal text-center max-w-[280px]">
                    Ищем совпадения среди ваших товаров
                </p>
<!-- ProgressBar Section -->
<div class="w-full mt-10">
<div class="flex flex-col gap-3">
<div class="flex gap-6 justify-between">
<p class="text-[#0d1a1c] dark:text-white text-sm font-medium leading-normal">Обработано</p>
<p class="text-primary text-sm font-bold leading-normal">60%</p>
</div>
<div class="h-2 w-full rounded-full bg-primary/20">
<div class="h-full rounded-full bg-primary" style="width: 60%;"></div>
</div>
</div>
</div>
</div>
</div>
<!-- AI Footer -->
<div class="pb-12 flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-primary text-[20px]">psychology</span>
<p class="text-[#757575] dark:text-gray-500 text-[12px] font-medium tracking-wide">Powered by AI</p>
</div>
<!-- Home Indicator Spacer -->
<div class="h-8 w-full flex justify-center items-end pb-2">
<div class="w-32 h-1 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
</div>
</div>
</body></html>
