<!DOCTYPE html>

<html class="light" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0bb5cb",
                        "background-light": "#f5f5f5",
                        "background-dark": "#102022",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a2e31",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .receipt-line {
            height: 4px;
            background-color: #e2e8f0;
            border-radius: 2px;
            margin-bottom: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#0d1a1c] dark:text-white antialiased">
<!-- Main Container simulating iPhone 14 Pro aspect ratio/size in a web view -->
<div class="relative mx-auto flex h-auto min-h-screen max-w-[393px] flex-col overflow-x-hidden shadow-2xl bg-background-light dark:bg-background-dark">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 flex items-center bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-200 dark:border-gray-800">
<div class="flex size-12 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined text-[#0d1a1c] dark:text-white" style="font-size: 24px;">arrow_back</span>
</div>
<h2 class="text-[#0d1a1c] dark:text-white text-lg font-semibold leading-tight tracking-[-0.015em] flex-1 text-center">Шаблоны чеков</h2>
<div class="flex size-12 items-center justify-end">
<button class="flex size-10 cursor-pointer items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-[#0d1a1c] dark:text-white" style="font-size: 24px;">add</span>
</button>
</div>
</header>
<!-- Content Area -->
<main class="flex-1 px-4 py-6 space-y-4 overflow-y-auto">
<!-- Card 1: Active Standard Template -->
<div class="group relative flex flex-col items-stretch justify-start rounded-xl border-2 border-primary bg-surface-light dark:bg-surface-dark p-4 shadow-sm transition-all hover:shadow-md">
<div class="flex items-center justify-between mb-3">
<p class="text-lg font-bold leading-tight tracking-tight text-[#0d1a1c] dark:text-white">Стандартный</p>
<span class="rounded-full bg-primary px-3 py-1 text-xs font-semibold text-white">Активный</span>
</div>
<!-- Receipt Preview Block -->
<div class="mb-4 flex w-full flex-col rounded-lg bg-gray-50 dark:bg-gray-800/50 p-4 border border-gray-100 dark:border-gray-700">
<div class="receipt-line w-1/3 self-center mb-3"></div>
<div class="receipt-line w-2/3"></div>
<div class="receipt-line w-1/2"></div>
<div class="receipt-line w-full mt-2"></div>
<div class="receipt-line w-full"></div>
<div class="receipt-line w-1/4 mt-2"></div>
</div>
<p class="text-gray-500 dark:text-gray-400 text-sm leading-normal">Название, адрес, товары, итого, QR</p>
<div class="mt-4 flex justify-end">
<button class="flex h-8 items-center justify-center rounded-lg bg-primary/10 px-4 text-primary text-sm font-semibold">
                        Выбрано
                    </button>
</div>
</div>
<!-- Card 2: Compact Template -->
<div class="group relative flex flex-col items-stretch justify-start rounded-xl border border-gray-200 dark:border-gray-800 bg-surface-light dark:bg-surface-dark p-4 shadow-sm transition-all hover:shadow-md">
<div class="flex items-center justify-between mb-3 text-[#0d1a1c] dark:text-white">
<p class="text-lg font-bold leading-tight tracking-tight">Компактный</p>
</div>
<!-- Receipt Preview Block (Smaller) -->
<div class="mb-4 flex w-full flex-col rounded-lg bg-gray-50 dark:bg-gray-800/50 p-4 border border-gray-100 dark:border-gray-700">
<div class="receipt-line w-full"></div>
<div class="receipt-line w-full"></div>
<div class="receipt-line w-1/3 mt-1"></div>
</div>
<p class="text-gray-500 dark:text-gray-400 text-sm leading-normal">Только товары и итого, без адреса</p>
<div class="mt-4 flex justify-end">
<button class="flex h-8 items-center justify-center rounded-lg bg-primary px-4 text-white text-sm font-semibold hover:bg-opacity-90 transition-colors">
                        Выбрать
                    </button>
</div>
</div>
<!-- Card 3: Detailed Template -->
<div class="group relative flex flex-col items-stretch justify-start rounded-xl border border-gray-200 dark:border-gray-800 bg-surface-light dark:bg-surface-dark p-4 shadow-sm transition-all hover:shadow-md">
<div class="flex items-center justify-between mb-3 text-[#0d1a1c] dark:text-white">
<p class="text-lg font-bold leading-tight tracking-tight">Подробный</p>
</div>
<!-- Receipt Preview Block (Detailed/Longer) -->
<div class="mb-4 flex w-full flex-col rounded-lg bg-gray-50 dark:bg-gray-800/50 p-4 border border-gray-100 dark:border-gray-700">
<div class="receipt-line w-1/4 self-center mb-2"></div>
<div class="receipt-line w-3/4"></div>
<div class="receipt-line w-2/3"></div>
<div class="receipt-line w-full border-t border-dashed mt-1 pt-1 border-gray-300"></div>
<div class="receipt-line w-full"></div>
<div class="receipt-line w-full"></div>
<div class="receipt-line w-full"></div>
<div class="receipt-line w-1/2 mt-2"></div>
<div class="receipt-line w-1/3"></div>
</div>
<p class="text-gray-500 dark:text-gray-400 text-sm leading-normal">Полная информация + скидки + баллы лояльности</p>
<div class="mt-4 flex justify-end">
<button class="flex h-8 items-center justify-center rounded-lg bg-primary px-4 text-white text-sm font-semibold hover:bg-opacity-90 transition-colors">
                        Выбрать
                    </button>
</div>
</div>
</main>
<!-- Bottom Action Button -->
<footer class="sticky bottom-0 bg-background-light dark:bg-background-dark p-4 pt-2 pb-8">
<button class="flex w-full cursor-pointer items-center justify-center gap-2 overflow-hidden rounded-xl border-2 border-primary h-12 px-5 bg-transparent text-primary hover:bg-primary hover:text-white transition-all duration-200 font-bold leading-normal tracking-[0.015em]">
<span class="material-symbols-outlined" style="font-size: 20px;">add_circle</span>
<span class="truncate">Создать свой шаблон</span>
</button>
</footer>
</div>
<!-- Hidden visual helper for dynamic image/pattern placeholder -->
<div style="display: none;">
<div data-alt="Abstract subtle geometric pattern background"></div>
</div>
</body></html>
