<!DOCTYPE html>

<html class="light" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00bdd6",
                        "background-light": "#ffffff",
                        "background-dark": "#0f2123",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .iphone-14-pro {
            width: 393px;
            height: 852px;
            max-width: 100%;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<!-- iPhone 14 Pro Container -->
<div class="iphone-14-pro bg-background-light dark:bg-background-dark shadow-2xl flex flex-col">
<!-- Top Status Bar Placeholder -->
<div class="flex items-center bg-transparent p-4 pb-2 justify-end w-full">
<div class="flex gap-1.5 items-center">
<span class="material-symbols-outlined text-sm dark:text-white">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-sm dark:text-white">wifi</span>
<span class="material-symbols-outlined text-sm dark:text-white">battery_full</span>
</div>
</div>
<!-- Illustration Area (60% height) -->
<div class="flex-grow flex flex-col items-center justify-center px-8">
<div class="w-full aspect-square max-w-[280px] relative flex flex-col items-center justify-center bg-primary/5 rounded-full">
<!-- Flat/Line Art Illustration Placeholder -->
<div class="relative w-48 h-48 flex items-center justify-center">
<!-- Gift Box Graphic -->
<div class="w-32 h-32 border-4 border-primary rounded-xl flex items-center justify-center relative bg-white">
<div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 w-8 h-8 rotate-45 border-4 border-primary bg-white"></div>
<div class="absolute w-full h-1 bg-primary"></div>
<div class="absolute w-1 h-full bg-primary"></div>
<span class="material-symbols-outlined text-primary text-6xl font-light">card_giftcard</span>
</div>
<!-- Badge -->
<div class="absolute -bottom-2 -right-2 bg-primary text-white px-4 py-2 rounded-full font-bold text-lg shadow-lg">
                        10 дней
                    </div>
</div>
</div>
</div>
<!-- Content Area -->
<div class="px-6 pb-12 flex flex-col items-center">
<!-- Page Indicators -->
<div class="flex w-full flex-row items-center justify-center gap-3 py-6">
<div class="h-2 w-2 rounded-full bg-[#cde6ea] dark:bg-gray-700"></div>
<div class="h-2 w-2 rounded-full bg-[#cde6ea] dark:bg-gray-700"></div>
<div class="h-2 w-2 rounded-full bg-[#cde6ea] dark:bg-gray-700"></div>
<div class="h-2 w-2 rounded-full bg-primary"></div>
</div>
<!-- Headline -->
<h3 class="text-[#0c1b1d] dark:text-white tracking-tight text-2xl font-bold leading-tight text-center pb-2">
                Начните бесплатно
            </h3>
<!-- Body Text -->
<p class="text-[#757575] dark:text-gray-400 text-base font-normal leading-normal pb-8 text-center max-w-[280px]">
                10 дней полного доступа без оплаты
            </p>
<!-- CTA Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-4 rounded-lg transition-colors shadow-md active:scale-[0.98]">
                Начать бесплатно
            </button>
<!-- iOS Home Indicator Spacing -->
<div class="h-6"></div>
</div>
</div>
</body></html>
