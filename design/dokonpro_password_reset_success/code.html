<!DOCTYPE html>

<html class="light" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00bdd6",
                        "success": "#4CAF50",
                        "background-light": "#f5f8f8",
                        "background-dark": "#0f2123",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem", // 12px based on user request
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom size for the success icon background */
        .success-circle {
            width: 80px;
            height: 80px;
        }
        /* iPhone 14 Pro specific height constraint for mockup preview */
        .iphone-frame {
            max-width: 393px;
            height: 852px;
            margin: 0 auto;
            position: relative;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark flex items-center justify-center min-h-screen">
<!-- Mobile Screen Container (iPhone 14 Pro aspect ratio) -->
<div class="iphone-frame bg-white dark:bg-background-dark w-full shadow-2xl flex flex-col overflow-hidden">
<!-- Top Status Bar Area -->
<div class="h-12 w-full flex items-center justify-between px-8">
<span class="text-sm font-semibold dark:text-white">9:41</span>
<div class="flex gap-1.5 items-center">
<span class="material-symbols-outlined text-[18px] dark:text-white">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[18px] dark:text-white">wifi</span>
<span class="material-symbols-outlined text-[18px] dark:text-white rotate-90">battery_full</span>
</div>
</div>
<!-- Main Content (Centered) -->
<div class="flex-1 flex flex-col items-center justify-center px-6">
<!-- Success Icon -->
<div class="success-circle bg-success rounded-full flex items-center justify-center mb-8 shadow-sm">
<span class="material-symbols-outlined text-white text-[48px] font-bold">check</span>
</div>
<!-- Headline Text -->
<h3 class="text-[#212121] dark:text-white tracking-tight text-2xl font-bold leading-tight text-center pb-2">
                Пароль изменён!
            </h3>
<!-- Body Text -->
<p class="text-[#757575] dark:text-gray-400 text-sm font-normal leading-relaxed text-center max-w-[280px]">
                Теперь вы можете войти с новым паролем
            </p>
</div>
<!-- Bottom Action Area -->
<div class="p-6 pb-12">
<!-- Single Button -->
<div class="flex w-full">
<button class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-14 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] active:opacity-90 transition-opacity">
<span class="truncate">Войти в аккаунт</span>
</button>
</div>
</div>
<!-- iOS Home Indicator -->
<div class="flex justify-center pb-2">
<div class="w-32 h-1.5 bg-gray-300 dark:bg-gray-700 rounded-full"></div>
</div>
</div>
</body></html>
