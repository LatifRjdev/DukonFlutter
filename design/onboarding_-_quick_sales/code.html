<!DOCTYPE html>

<html class="light" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00bdd6",
                        "background-light": "#ffffff",
                        "background-dark": "#0f2123",
                        "text-main": "#212121",
                        "text-secondary": "#757575",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .illustration-bg {
            background: radial-gradient(circle at center, rgba(0, 189, 214, 0.05) 0%, rgba(255, 255, 255, 0) 70%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-text-main dark:text-white antialiased">
<div class="relative flex min-h-screen w-full flex-col max-w-[430px] mx-auto overflow-hidden bg-background-light dark:bg-background-dark shadow-2xl">
<!-- Top 60% Illustration Area -->
<div class="relative flex-[6] flex flex-col items-center justify-center px-8 pt-10 illustration-bg">
<div class="w-full aspect-square relative flex items-center justify-center">
<!-- Abstract Illustration Representation -->
<div class="relative w-64 h-64 bg-white dark:bg-slate-800 rounded-3xl shadow-xl flex items-center justify-center border border-gray-100 dark:border-slate-700">
<!-- Cash Register Icon -->
<span class="material-symbols-outlined text-[120px] text-primary" style="font-variation-settings: 'FILL' 0, 'wght' 200;">
                        point_of_sale
                    </span>
<!-- Decorative Elements (Coins/Receipt) -->
<div class="absolute -top-4 -right-4 w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center border border-primary/20">
<span class="material-symbols-outlined text-primary text-3xl">payments</span>
</div>
<div class="absolute -bottom-6 -left-2 w-20 h-24 bg-gray-50 dark:bg-slate-700 rounded-lg shadow-md border border-gray-100 dark:border-slate-600 flex flex-col p-2 gap-1">
<div class="h-1 w-full bg-gray-200 dark:bg-slate-500 rounded"></div>
<div class="h-1 w-3/4 bg-gray-200 dark:bg-slate-500 rounded"></div>
<div class="h-1 w-full bg-gray-200 dark:bg-slate-500 rounded"></div>
<div class="mt-auto h-2 w-full bg-primary/30 rounded"></div>
</div>
</div>
<!-- Background Decorative Circles -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 border-2 border-primary/5 rounded-full -z-10"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] border border-primary/5 rounded-full -z-10"></div>
</div>
<!-- Metadata for image description as per instructions -->
<div class="hidden" data-alt="Illustration of a turquoise cash register terminal with receipt and coins"></div>
</div>
<!-- Content Area -->
<div class="flex-[4] flex flex-col px-6 pb-10">
<!-- Pagination Indicators -->
<div class="flex w-full flex-row items-center justify-center gap-2 py-6">
<div class="h-2 w-2 rounded-full bg-primary/20"></div>
<div class="h-2 w-5 rounded-full bg-primary"></div> <!-- Active Dot -->
<div class="h-2 w-2 rounded-full bg-primary/20"></div>
<div class="h-2 w-2 rounded-full bg-primary/20"></div>
</div>
<!-- Text Content -->
<div class="flex flex-col items-center text-center space-y-3 mb-auto">
<h3 class="text-text-main dark:text-white text-[24px] font-bold leading-tight tracking-tight">
                    Быстрые продажи
                </h3>
<p class="text-text-secondary dark:text-gray-400 text-base font-normal leading-relaxed px-4">
                    Продавайте в одно касание, даже без интернета
                </p>
</div>
<!-- Actions Container -->
<div class="flex flex-col gap-4 mt-8">
<!-- Primary Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white text-base font-bold h-[54px] rounded-lg transition-colors shadow-lg shadow-primary/20 flex items-center justify-center">
                    Далее
                </button>
<!-- Secondary Link -->
<button class="w-full text-text-secondary dark:text-gray-400 text-base font-medium py-2 hover:text-text-main dark:hover:text-white transition-colors">
                    Пропустить
                </button>
</div>
<!-- iOS Home Indicator Spacing -->
<div class="h-4"></div>
</div>
</div>
</body></html>
