<!DOCTYPE html>

<html class="light" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DukonPro Add New Expense</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00bdd6",
                        "background-light": "#ffffff",
                        "background-dark": "#0f2123",
                        "muted": "#f5f8f8",
                        "border-color": "#e5e7eb"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>body {
    font-family: "Inter", sans-serif;
    -webkit-tap-highlight-color: transparent
    }
.no-scrollbar::-webkit-scrollbar {
    display: none
    }
.dashed-border {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuBpFSUuyw53dT38NIvK-U8kEuiH5OJCCxCbrRTeKLblwnJwANj1pJGBCb9VSboFiYy9w5c_r5V2ogfv67l7GH4_JZYh0mYRhjEpqo4MRBltDWqxwDsgUG9O_1TQ0qJF26x-XahRVpqmb2iyj6CbkbZfhc-JrIYtOFv7upGFua8hkR6LWREmGtZI_ffYc2K_xTKIAosWDnx_yBWvZENk_RVOj0ZGFeWleUb129zU3mG3KDisiGcmSnHCldHtMtmXkpWUKvQB_tQ-bWNZ);
    border-radius: 12px
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#0c1b1d] dark:text-white antialiased min-h-screen">
<div class="max-w-[393px] mx-auto min-h-[852px] bg-white dark:bg-background-dark flex flex-col relative shadow-2xl overflow-hidden">
<!-- TopAppBar -->
<header class="flex items-center bg-white dark:bg-background-dark px-4 py-3 sticky top-0 z-10 border-b border-transparent">
<button class="text-[#0c1b1d] dark:text-white flex items-center justify-center w-10 h-10 -ml-2">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="flex-1 text-center text-lg font-semibold pr-8">Новый расход</h1>
</header>
<main class="flex-1 overflow-y-auto no-scrollbar pb-32">
<!-- HeadlineText (Amount Input) -->
<div class="px-4 pt-8 pb-6 text-center">
<div class="inline-flex items-baseline justify-center">
<span class="text-4xl font-bold tracking-tight text-[#0c1b1d] dark:text-white">0</span>
<span class="text-4xl font-bold tracking-tight text-[#0c1b1d] dark:text-white ml-2">TJS</span>
</div>
<div class="mt-1 w-full flex justify-center">
<div class="h-1 w-12 bg-primary/20 rounded-full"></div>
</div>
</div>
<!-- Category Section -->
<section class="mt-4">
<h3 class="px-4 text-[15px] font-semibold text-[#0c1b1d] dark:text-white/90 mb-3">Категория *</h3>
<div class="flex flex-wrap gap-2 px-4">
<button class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-muted dark:bg-white/5 border border-transparent">
<span class="material-symbols-outlined text-[20px]">home_work</span>
<span class="text-sm font-medium">Аренда</span>
</button>
<button class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-muted dark:bg-white/5 border border-transparent">
<span class="material-symbols-outlined text-[20px]">payments</span>
<span class="text-sm font-medium">Зарплата</span>
</button>
<button class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-primary text-white border border-primary">
<span class="material-symbols-outlined text-[20px]">shopping_cart</span>
<span class="text-sm font-medium">Закупки</span>
</button>
<button class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-muted dark:bg-white/5 border border-transparent">
<span class="material-symbols-outlined text-[20px]">local_shipping</span>
<span class="text-sm font-medium">Транспорт</span>
</button>
<button class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-muted dark:bg-white/5 border border-transparent">
<span class="material-symbols-outlined text-[20px]">bolt</span>
<span class="text-sm font-medium">Коммунальные</span>
</button>
<button class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-muted dark:bg-white/5 border border-transparent">
<span class="material-symbols-outlined text-[20px]">more_horiz</span>
<span class="text-sm font-medium">Прочее</span>
</button>
</div>
</section>
<!-- Form Fields -->
<section class="mt-8 px-4 space-y-5">
<!-- Описание -->
<div class="flex flex-col gap-2">
<label class="text-[15px] font-semibold text-[#0c1b1d] dark:text-white/90">Описание</label>
<div class="relative">
<input class="w-full h-14 px-4 bg-white dark:bg-background-dark border border-border-color dark:border-white/10 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-gray-400 dark:placeholder:text-gray-600" placeholder="Введите описание" type="text"/>
</div>
</div>
<!-- Дата -->
<div class="flex flex-col gap-2">
<label class="text-[15px] font-semibold text-[#0c1b1d] dark:text-white/90">Дата</label>
<div class="relative">
<input class="w-full h-14 px-4 pr-12 bg-white dark:bg-background-dark border border-border-color dark:border-white/10 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" type="text" value="30.01.2026"/>
<span class="material-symbols-outlined absolute right-4 top-4 text-gray-400">calendar_today</span>
</div>
</div>
<!-- Фото чека -->
<div class="flex flex-col gap-2">
<label class="text-[15px] font-semibold text-[#0c1b1d] dark:text-white/90">Фото чека</label>
<div class="dashed-border h-32 flex flex-col items-center justify-center gap-2 cursor-pointer bg-muted/30 hover:bg-muted/50 transition-colors">
<span class="material-symbols-outlined text-gray-400 text-3xl">photo_camera</span>
<p class="text-sm text-gray-500 font-medium">Прикрепить фото</p>
</div>
</div>
<!-- Повторяющийся Toggle -->
<div class="pt-4 border-t border-border-color dark:border-white/10">
<div class="flex items-center justify-between py-2">
<span class="text-[15px] font-semibold text-[#0c1b1d] dark:text-white/90">Повторяющийся</span>
<div class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-gray-200 transition-colors duration-200 ease-in-out focus:outline-none dark:bg-white/10">
<span class="translate-x-0 pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
</div>
</div>
<!-- Disabled Frequency Chips -->
<div class="flex gap-2 mt-4 opacity-40 pointer-events-none">
<div class="px-4 py-2 rounded-lg bg-muted border border-border-color text-xs font-semibold">Ежедневно</div>
<div class="px-4 py-2 rounded-lg bg-muted border border-border-color text-xs font-semibold">Еженедельно</div>
<div class="px-4 py-2 rounded-lg bg-muted border border-border-color text-xs font-semibold">Ежемесячно</div>
</div>
</div>
</section>
</main>
<!-- Fixed Footer Action -->
<footer class="absolute bottom-0 left-0 right-0 p-4 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border-t border-border-color dark:border-white/10">
<button class="w-full bg-primary hover:bg-primary/90 active:scale-[0.98] text-white font-bold py-4 rounded-lg transition-all shadow-lg shadow-primary/20">
                Сохранить расход
            </button>
</footer>
</div>
</body></html>
