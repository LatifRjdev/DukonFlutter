<!DOCTYPE html>

<html class="light" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DuckonPro Customer Debts</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ecda",
                        "background-light": "#f5f5f5",
                        "background-dark": "#102220",
                        "debt-red": "#d32f2f",
                        "debt-bg-red": "#ffeeee"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-screen {
            width: 393px;
            height: 852px;
            margin: 0 auto;
            position: relative;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .ios-screen::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen">
<div class="ios-screen bg-background-light dark:bg-background-dark shadow-2xl flex flex-col">
<!-- TopAppBar -->
<header class="sticky top-0 z-20 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md px-4 py-3 flex items-center justify-between border-b border-gray-100 dark:border-gray-800">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-gray-800 dark:text-gray-100">arrow_back</span>
</button>
<h1 class="text-lg font-bold text-gray-900 dark:text-white leading-tight">Долги клиентов</h1>
</div>
<button class="flex items-center justify-center w-10 h-10 rounded-full">
<span class="material-symbols-outlined text-gray-800 dark:text-gray-100">more_vert</span>
</button>
</header>
<main class="flex-1 p-4 flex flex-col gap-4">
<!-- Summary Banner (Card Modification) -->
<div class="bg-debt-bg-red dark:bg-red-900/20 p-5 rounded-2xl flex flex-col gap-1 border border-red-100 dark:border-red-900/30">
<p class="text-debt-red dark:text-red-400 text-sm font-medium uppercase tracking-wider">Общий долг клиентов</p>
<div class="flex items-baseline gap-1">
<span class="text-debt-red dark:text-red-400 text-[24px] font-bold">45,200</span>
<span class="text-debt-red dark:text-red-400 text-lg font-semibold">TJS</span>
</div>
</div>
<!-- Chips (Filter) -->
<div class="flex gap-2 overflow-x-auto pb-2 -mx-1 px-1 scrollbar-hide">
<button class="flex h-10 shrink-0 items-center justify-center px-5 rounded-full bg-primary text-gray-900 text-sm font-semibold shadow-sm transition-all active:scale-95">
                    Все
                </button>
<button class="flex h-10 shrink-0 items-center justify-center px-5 rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 text-sm font-medium transition-all active:scale-95">
                    Просроченные
                </button>
<button class="flex h-10 shrink-0 items-center justify-center px-5 rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 text-sm font-medium transition-all active:scale-95">
                    Текущие
                </button>
</div>
<!-- Debtor List -->
<div class="flex flex-col gap-3">
<!-- Debtor 1 -->
<div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col gap-4">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-full bg-blue-100 dark:bg-blue-900/40 flex items-center justify-center text-blue-600 dark:text-blue-300 font-bold text-sm">АК</div>
<div>
<h3 class="font-bold text-gray-900 dark:text-white">Ahmad Karimov</h3>
<p class="text-sm text-gray-500 dark:text-gray-400">Срок: 15.02.2026</p>
</div>
</div>
<div class="text-right">
<p class="text-lg font-bold text-debt-red">12,500 TJS</p>
</div>
</div>
<div class="flex items-center justify-between gap-3">
<button class="flex items-center justify-center w-10 h-10 rounded-full border border-gray-200 dark:border-gray-700 text-primary transition-all active:scale-90">
<span class="material-symbols-outlined">call</span>
</button>
<button class="flex-1 h-10 rounded-full border-2 border-primary text-gray-900 dark:text-white text-sm font-bold transition-all active:bg-primary active:text-white">
                            Принять оплату
                        </button>
</div>
</div>
<!-- Debtor 2 (Overdue) -->
<div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col gap-4">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-full bg-emerald-100 dark:bg-emerald-900/40 flex items-center justify-center text-emerald-600 dark:text-emerald-300 font-bold text-sm">ФМ</div>
<div>
<h3 class="font-bold text-gray-900 dark:text-white">Firuz Makhmadov</h3>
<span class="inline-flex items-center rounded-full bg-red-50 dark:bg-red-900/30 px-2 py-0.5 text-xs font-medium text-red-600 dark:text-red-400">Просрочен 5 дней</span>
</div>
</div>
<div class="text-right">
<p class="text-lg font-bold text-debt-red">8,300 TJS</p>
</div>
</div>
<div class="flex items-center justify-between gap-3">
<button class="flex items-center justify-center w-10 h-10 rounded-full border border-gray-200 dark:border-gray-700 text-primary transition-all active:scale-90">
<span class="material-symbols-outlined">call</span>
</button>
<button class="flex-1 h-10 rounded-full border-2 border-primary text-gray-900 dark:text-white text-sm font-bold transition-all active:bg-primary active:text-white">
                            Принять оплату
                        </button>
</div>
</div>
<!-- Debtor 3 -->
<div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col gap-4">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-full bg-purple-100 dark:bg-purple-900/40 flex items-center justify-center text-purple-600 dark:text-purple-300 font-bold text-sm">МК</div>
<div>
<h3 class="font-bold text-gray-900 dark:text-white">Mariya Kim</h3>
<p class="text-sm text-gray-500 dark:text-gray-400">Срок: 28.02.2026</p>
</div>
</div>
<div class="text-right">
<p class="text-lg font-bold text-debt-red">3,200 TJS</p>
</div>
</div>
<div class="flex items-center justify-between gap-3">
<button class="flex items-center justify-center w-10 h-10 rounded-full border border-gray-200 dark:border-gray-700 text-primary transition-all active:scale-90">
<span class="material-symbols-outlined">call</span>
</button>
<button class="flex-1 h-10 rounded-full border-2 border-primary text-gray-900 dark:text-white text-sm font-bold transition-all active:bg-primary active:text-white">
                            Принять оплату
                        </button>
</div>
</div>
<!-- Debtor 4 (Overdue) -->
<div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col gap-4">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-full bg-orange-100 dark:bg-orange-900/40 flex items-center justify-center text-orange-600 dark:text-orange-300 font-bold text-sm">СР</div>
<div>
<h3 class="font-bold text-gray-900 dark:text-white">Sobir Rakhimov</h3>
<span class="inline-flex items-center rounded-full bg-red-50 dark:bg-red-900/30 px-2 py-0.5 text-xs font-medium text-red-600 dark:text-red-400">Просрочен 12 дней</span>
</div>
</div>
<div class="text-right">
<p class="text-lg font-bold text-debt-red">21,200 TJS</p>
</div>
</div>
<div class="flex items-center justify-between gap-3">
<button class="flex items-center justify-center w-10 h-10 rounded-full border border-gray-200 dark:border-gray-700 text-primary transition-all active:scale-90">
<span class="material-symbols-outlined">call</span>
</button>
<button class="flex-1 h-10 rounded-full border-2 border-primary text-gray-900 dark:text-white text-sm font-bold transition-all active:bg-primary active:text-white">
                            Принять оплату
                        </button>
</div>
</div>
</div>
</main>
<!-- Bottom Safe Area Padding for iOS -->
<div class="h-8 w-full bg-background-light dark:bg-background-dark shrink-0"></div>
</div>
</body></html>
